[package]
name = "json-comments"
version = "0.1.1"
edition = "2024"
description = "Rust-backed JSON comment and trailing comma stripper"

[lib]
crate-type = ["cdylib"]
name = "_json_comments"

[dependencies]
# fork of json-comments-rs that handles trailing commas
json-strip-comments = "3.1.0"
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
